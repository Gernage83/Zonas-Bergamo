<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zonas Bergamo</title>
<style>
body{font-family:sans-serif;background:#f1f5f9;margin:0;padding:0}
.header{background:#1e40af;color:white;padding:16px}
h1{margin:0;font-size:1.3rem}
.container{padding:16px;max-width:600px;margin:0 auto}
input{width:100%;padding:12px;font-size:1rem;border:2px solid #ddd;border-radius:10px;margin-bottom:16px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;padding:10px;text-align:center;background:white;border:2px solid #ddd;border-radius:8px;font-weight:bold}
.tab.active{border-color:#1e40af;background:#eff6ff;color:#1e40af}
.list{background:white;border-radius:10px;padding:8px}
.item{padding:10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
select{padding:6px;border-radius:6px}
.badge{padding:2px 8px;border-radius:20px;color:white;font-size:12px}
.isola{background:#7c3aed}.lago{background:#0891b2}.bassa{background:#d97706}.centro{background:#059669}
</style>
</head>
<body>
<div class="header">
  <h1>📦 Zonas Bergamo</h1>
  <div style="font-size:0.85rem;opacity:0.9">Separación de mercancía · Magazzino</div>
</div>
<div class="container">
  <input type="text" id="buscar" placeholder="Buscar comune...">
  <div class="tabs">
    <div class="tab active" onclick="mostrar('isola')">Isola</div>
    <div class="tab" onclick="mostrar('lago')">Lago</div>
    <div class="tab" onclick="mostrar('bassa')">Bassa</div>
    <div class="tab" onclick="mostrar('centro')">Centro</div>
  </div>
  <div id="contenido" class="list"></div>
</div>
<script>
const datos = {
isola: ["Ambivere","Bonate Sopra","Bonate Sotto","Bottanuco","Brembate","Brembate di Sopra","Calusco d'Adda","Capriate San Gervasio","Caprino Bergamasco","Carvico","Chignolo d'Isola","Cisano Bergamasco","Filago","Madone","Mapello","Medolago","Ponte San Pietro","Pontida","Presezzo","Solza","Sotto il Monte Giovanni XXIII","Suisio","Terno d'Isola","Villa d'Adda"],
lago: ["Adrara San Martino","Adrara San Rocco","Berzo San Fermo","Bianzano","Borgo di Terzo","Bossico","Carobbio degli Angeli","Casazza","Castro","Cenate Sopra","Cenate Sotto","Costa Volpino","Credaro","Endine Gaiano","Entratico","Fonteno","Foresto Sparso","Gandosso","Gaverina Terme","Gorlago","Grone","Lovere","Luzzana","Monasterolo del Castello","Parzanica","Pianico","Predore","Ranzanico","Riva di Solto","Rogno","San Paolo d'Argon","Sarnico","Solto Collina","Sovere","Spinone al Lago","Tavernola Bergamasca","Trescore Balneario","Viadanica","Vigano San Martino","Vigolo","Villongo","Zandobbio"],
centro: ["Almè","Alzano Lombardo","Azzano San Paolo","Bergamo","Curno","Gorle","Lallio","Mozzo","Nembro","Orio al Serio","Paladina","Pedrengo","Ponteranica","Pradalunga","Ranica","Scanzorosciate","Sorisole","Stezzano","Torre Boldone","Treviolo","Valbrembo","Villa d'Almè","Villa di Serio","Seriate","Grassobbio","Brusaporto","Bagnatica"],
bassa: ["Treviglio","Caravaggio","Romano di Lombardia","Dalmine","Osio Sopra","Osio Sotto","Verdello","Verdellino","Zanica","Cologno al Serio","Martinengo","Calcinate","Bolgare","Telgate","Urgnano","Ciserano","Boltiere","Levate","Comun Nuovo","Arcene","Lurano","Pognano","Spirano","Pontirolo Nuovo","Canonica d'Adda","Fara Gera d'Adda","Casirate d'Adda","Arzago d'Adda","Castel Rozzone","Brignano Gera d'Adda","Calvenzano","Misano di Gera d'Adda","Mozzanica","Bariano","Morengo","Pagazzano","Fornovo San Giovanni","Antegnate","Barbata","Calcio","Cividate al Piano","Cortenuova","Covo","Fara Olivana con Sola","Fontanella","Ghisalba","Isso","Mornico al Serio","Palosco","Pumenengo","Torre Pallavicina","Cavernago","Costa di Mezzate"]
};

let zonaActual = "isola";

function mostrar(zona) {
  zonaActual = zona;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  event.target.classList.add("active");
  dibujar();
}

function dibujar() {
  const lista = datos[zonaActual] || [];
  const busqueda = document.getElementById("buscar").value.toLowerCase();
  let html = "";
  lista.forEach(nombre => {
    if (busqueda && !nombre.toLowerCase().includes(busqueda)) return;
    html += `<div class="item"><span>${nombre}</span></div>`;
  });
  document.getElementById("contenido").innerHTML = html || "<div style='padding:20px;text-align:center;color:#666'>No hay resultados</div>";
}

document.getElementById("buscar").oninput = dibujar;
dibujar();
</script>
</body>
</html>
