<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Zonas Bergamo - Magazzino</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f1f5f9;color:#0f172a;padding-bottom:40px}
  .header{background:linear-gradient(135deg,#1e40af,#1e3a8a);color:white;padding:16px;position:sticky;top:0;z-index:20}
  .header h1{font-size:1.3rem;margin-bottom:2px}
  .header p{font-size:0.85rem;opacity:0.9}
  .container{max-width:640px;margin:0 auto;padding:16px}
  input,select,button{font-size:1rem}
  .search{width:100%;padding:13px 16px;border:2px solid #e2e8f0;border-radius:12px;margin-bottom:14px;outline:none}
  .search:focus{border-color:#1e40af}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
  .tab{background:white;border:2px solid #e2e8f0;border-radius:10px;padding:10px 4px;text-align:center;font-size:0.8rem;font-weight:600;color:#64748b}
  .tab.active{border-color:#1e40af;background:#eff6ff;color:#1e40af}
  .tab span{display:block;font-size:1.1rem;font-weight:700;color:#0f172a;margin-top:2px}
  .card{background:white;border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .nombre{font-weight:600;flex:1}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:0.75rem;font-weight:600;color:white}
  .isola{background:#7c3aed}.lago{background:#0891b2}.bassa{background:#d97706}.centro{background:#059669}
  select{padding:7px 8px;border-radius:8px;border:1px solid #e2e8f0;max-width:120px;background:white}
  .add-box{background:white;border-radius:12px;padding:14px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .add-box h3{font-size:0.95rem;margin-bottom:10px}
  .add-row{display:flex;gap:8px;margin-bottom:8px}
  .add-row input{flex:1;padding:10px;border:1px solid #e2e8f0;border-radius:8px}
  .add-row select{width:110px}
  .btn{background:#1e40af;color:white;border:none;padding:11px;border-radius:8px;width:100%;font-weight:600;cursor:pointer}
  .btn:active{opacity:0.9}
  .section-title{font-size:1.05rem;font-weight:700;margin:16px 0 10px;display:flex;align-items:center;gap:8px}
  .empty{text-align:center;color:#64748b;padding:20px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#0f172a;color:white;padding:12px 18px;border-radius:10px;font-size:0.9rem;opacity:0;transition:all .3s;z-index:50;max-width:90%;text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>
<div class="header">
  <h1>📦 Zonas Bergamo</h1>
  <p>Separación de mercancía · Magazzino</p>
</div>

<div class="container">
  <input class="search" id="buscar" placeholder="Buscar comune..." autocomplete="off">

  <div class="tabs">
    <div class="tab active" data-z="isola">Isola<span id="c-isola">0</span></div>
    <div class="tab" data-z="lago">Lago<span id="c-lago">0</span></div>
    <div class="tab" data-z="bassa">Bassa<span id="c-bassa">0</span></div>
    <div class="tab" data-z="centro">Centro<span id="c-centro">0</span></div>
  </div>

  <div class="add-box">
    <h3>➕ Agregar nueva ciudad</h3>
    <div class="add-row">
      <input type="text" id="nuevaCiudad" placeholder="Nombre del comune">
      <select id="nuevaZona">
        <option value="isola">Isola</option>
        <option value="lago">Lago</option>
        <option value="bassa">Bassa</option>
        <option value="centro">Centro</option>
      </select>
    </div>
    <button class="btn" id="btnAgregar">Agregar a la zona</button>
  </div>

  <div id="resultados"></div>
  <div id="lista"></div>
</div>

<div class="toast" id="toast"></div>
